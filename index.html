:root{--bg:#07071a;--panel:#12122b;--panel2:#1a1a3a;--line:#2b2b55;--txt:#f2f2ff;--mut:#9a9ac7;--pink:#ff2bd6;--cyan:#22e4ff;--lime:#b6ff3b;--vio:#8a5cff;--yel:#ffd23f;--red:#ff4d6d;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"RubikG",Arial,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 80% -10%,#2a0f4d 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#08324a 0%,transparent 60%),var(--bg)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
#app{position:relative;width:100%;height:100%;max-width:460px;overflow:hidden;background:#07071a}
@media (min-width:700px) and (min-height:700px){#app{height:min(900px,calc(100% - 40px));border-radius:34px;border:1px solid var(--line);box-shadow:0 0 0 8px #0e0e24,0 30px 80px #000a,0 0 60px #8a5cff33}
 body::after{content:"⌨️ אפשר גם רווח / Enter";position:fixed;bottom:18px;left:24px;color:var(--mut);font-size:13px;opacity:.7}}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.layer{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(var(--sat) + 14px) calc(var(--sar) + 16px) calc(var(--sab) + 14px) calc(var(--sal) + 16px);z-index:5}
.layer.on{display:flex;animation:fin .3s ease-out both}
@keyframes fin{from{opacity:0;transform:scale(.98)}}
.dim{background:#07071ae6;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:12px;background:#12122bcc;border:1px solid var(--line);font-weight:800;font-size:15px;white-space:nowrap}
.ibtn{width:44px;height:44px;border-radius:14px;background:#12122bcc;border:1px solid var(--line);font-size:19px;display:grid;place-items:center;flex:0 0 auto}
.go{width:100%;height:58px;border-radius:18px;font-size:20px;font-weight:900;color:#0a0a18;background:linear-gradient(90deg,var(--lime),var(--cyan));box-shadow:0 8px 26px #22e4ff40;transition:transform .12s}
.go:active,.btn:active{transform:scale(.97)}
.btn{width:100%;min-height:54px;border-radius:16px;font-size:16.5px;font-weight:800;background:var(--panel);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 12px;line-height:1.2;transition:transform .12s}
.btn.bb{border-color:var(--yel);background:linear-gradient(90deg,#3a2a05,#1a1408);color:#ffe9a6}
.btn small{display:block;font-size:12px;font-weight:600;opacity:.75}
.sp{flex:1}
.row{display:flex;gap:10px;align-items:center}
/* home */
.logo{font-size:clamp(50px,15vw,66px);font-weight:900;line-height:.92;letter-spacing:-.02em;background:linear-gradient(90deg,var(--lime),var(--cyan) 45%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px #22e4ff55)}
.en{direction:ltr;font-weight:900;letter-spacing:.25em;font-size:13px;color:var(--pink);align-self:flex-start;border:1px solid var(--pink);padding:3px 8px;border-radius:8px}
.tagline{font-size:16.5px;line-height:1.4;color:#d8d8f5;margin:0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{border-radius:16px;background:#ffffff0a;border:1px solid var(--line);padding:10px 4px;text-align:center}
.st b{display:block;font-size:20px}.st small{font-size:12px;color:var(--mut)}
.about{font-size:12.5px;color:var(--mut);text-align:center;line-height:1.45}
.howto{border-radius:16px;background:#ffffff08;border:1px solid var(--line);padding:11px 13px;font-size:14px;line-height:1.5;color:#d6d6f5}
.banner{border-radius:14px;padding:10px 12px;background:#b6ff3b14;border:1px solid #b6ff3b55;font-size:14.5px}
/* hud */
#hud{position:absolute;left:0;right:0;top:0;z-index:4;display:none;align-items:flex-start;gap:8px;padding:calc(var(--sat) + 12px) calc(var(--sar) + 14px) 0 calc(var(--sal) + 14px);pointer-events:none}
#hud.on{display:flex}
#hud .ibtn{pointer-events:auto}
#score{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 52px);font-size:64px;font-weight:900;line-height:1;text-shadow:0 0 24px #22e4ff88;direction:ltr}
#score.pop{animation:sp .25s}
@keyframes sp{50%{transform:translateX(-50%) scale(1.18)}}
#hearts{letter-spacing:2px}
#tip{position:absolute;bottom:calc(var(--sab) + 26px);left:0;right:0;text-align:center;color:#ffffffb0;font-weight:700;font-size:16px;z-index:4;pointer-events:none;display:none;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
/* over */
.ttl{font-size:clamp(28px,8vw,34px);font-weight:900;margin:0;text-align:center}
.bigsc{text-align:center;font-size:84px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,#9ad);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.nb{text-align:center;color:var(--yel);font-weight:900;letter-spacing:.15em;direction:ltr;animation:blink 1s infinite}
.col{display:flex;flex-direction:column;gap:10px}
.mut{color:var(--mut);font-size:14px;text-align:center;margin:0}
/* shop */
.skins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;overflow:auto;padding:2px}
.skin{border-radius:18px;background:var(--panel);border:1.5px solid var(--line);padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:15px;min-height:128px;justify-content:center}
.skin .pv{display:flex;flex-direction:column;align-items:center;gap:3px}
.skin .pv i{display:block;height:11px;border-radius:3px}
.skin.sel{border-color:var(--lime);box-shadow:0 0 20px #b6ff3b44}
.skin .pr{font-size:13px;color:var(--yel)}.skin.lock{opacity:.85}.skin.cant .pr{color:var(--mut)}
/* brain break */
#bb{background:linear-gradient(180deg,#0b0b22,#07071a);padding-top:calc(var(--sat) + 10px)}
.adbar{display:flex;align-items:center;gap:8px;min-height:44px}
.adtag{direction:ltr;font-weight:900;font-size:12.5px;letter-spacing:.1em;background:var(--yel);color:#111;padding:5px 9px;border-radius:7px;white-space:nowrap}
.cd{font-weight:800;color:var(--mut);font-size:14px;direction:ltr;min-width:38px}
.skipad{height:44px;padding:0 14px;border-radius:12px;background:#ffffff14;border:1px solid #ffffff33;font-weight:700;font-size:14px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .4s}
.skipad.on{opacity:1;pointer-events:auto}
.adprog{height:4px;border-radius:3px;background:#ffffff14;overflow:hidden;margin:8px 0 10px}
.adprog i{display:block;height:100%;width:0;background:var(--yel);transition:width .25s linear}
.bbbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;scrollbar-width:none;padding:2px}
.bbbody::-webkit-scrollbar{display:none}
.tchip{align-self:flex-start;font-size:13px;font-weight:800;padding:5px 10px;border-radius:10px;background:#22e4ff1a;color:var(--cyan);border:1px solid #22e4ff55}
.h2{font-size:clamp(21px,6vw,25px);font-weight:900;margin:0;line-height:1.2}
.qbox{border-radius:20px;background:linear-gradient(160deg,#1d1846,#0f0f2a);border:1.5px solid #8a5cff66;padding:14px;text-align:center;font-size:17px;font-weight:700;line-height:1.45}
.qbox .m{font-size:30px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:10px;align-items:flex-start;border-radius:16px;background:var(--panel);border:1px solid var(--line);padding:10px 12px;animation:stin .45s cubic-bezier(.2,1.2,.3,1) both}
.step.fin{border-color:var(--lime);background:#b6ff3b10}
@keyframes stin{from{opacity:0;transform:translateY(14px) scale(.96)}}
.step .nm{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--vio);display:grid;place-items:center;font-weight:900;font-size:14px}
.step.fin .nm{background:var(--lime);color:#000}
.step .tx{flex:1;min-width:0;font-size:15px;line-height:1.4;font-weight:600}
.step .tx .m{display:block;font-size:21px;margin-top:4px}
.step .vz{margin-top:6px}
.steps.compact .step{padding:7px 10px;animation:none}.steps.compact .step .tx .m{font-size:18px}
.m{direction:ltr;unicode-bidi:isolate;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.m em{font-style:normal;color:var(--yel);background:#ffd23f1f;border-radius:6px;padding:0 3px}
.m em.c2{color:var(--cyan);background:#22e4ff1f}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 3px;font-size:.92em}
.fr b{font-weight:800;padding:0 3px}
.fr b:first-child{border-bottom:2px solid currentColor;padding-bottom:2px}
.fr b:last-child{padding-top:2px}
.fbar{display:flex;gap:2px;height:16px;margin:4px 0;direction:ltr}
.fbar i{flex:1;border-radius:3px;background:#ffffff1a}
.fbar i.on{background:var(--yel)}.fbar i.on.c2{background:var(--cyan)}
.brow{display:flex;align-items:center;gap:8px;margin:5px 0}.brow .bl{flex:0 0 38px;text-align:center;font-size:15px}.brow .fbar{flex:1;height:22px;margin:0}
.fbar i{display:flex;overflow:hidden}.fbar.split i b{flex:1;border-inline-start:2px solid transparent;animation:cut .5s 1s forwards}.fbar.split i b:first-child{border:0}
@keyframes cut{to{border-inline-start-color:#07071a}}
.nl{position:relative;direction:ltr;height:66px;margin:4px 16px 0}.nl .ax{position:absolute;left:0;right:0;top:38px;height:2px;background:#ffffffaa}
.nl .ax i{position:absolute;top:-5px;width:2px;height:12px;background:#ffffffaa;transform:translateX(-1px)}.nl .ax i.h{background:none;border-left:2px dashed #ffffff55;height:18px;top:-8px}
.nl .z{position:absolute;top:46px;transform:translateX(-50%);font-size:12px;color:var(--mut);font-weight:700}.nl .z .fr{font-size:11px}
.nl .mk{position:absolute;bottom:30px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;color:var(--yel);font-size:14px}.nl .mk.c2{color:var(--cyan)}
.nl .mk u{display:block;width:12px;height:12px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;margin-top:2px;transform:translateY(7px)}
#backB:not(.on){opacity:.35;pointer-events:none}
.routes{display:flex;flex-direction:column;gap:6px}.routes .rt{border-radius:12px;background:#ffffff0a;border:1px dashed #8a5cff88;padding:7px 10px;font-size:14.5px}.routes .rt small{display:block;font-size:13px;color:var(--mut);margin-top:2px}.routes .rt .m{display:block;font-size:20px;margin-top:3px}
.colz{direction:ltr;display:inline-block;font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;text-align:right;line-height:1.35;padding:4px 12px;border-radius:12px;background:#ffffff0a;letter-spacing:.06em}
.colz hr{border:0;border-top:2px solid var(--mut);margin:2px 0}
.colz .z{color:var(--pink)}
.area{display:flex;direction:ltr;gap:3px;height:44px;margin-top:4px}
.area div{border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#000;min-width:44px}
.area div:first-child{background:var(--cyan)}.area div:last-child{background:var(--yel)}
.ctr{display:flex;justify-content:center}
.turn{opacity:0;pointer-events:none;transition:opacity .4s}.turn.on{opacity:1;pointer-events:auto}
.spon{font-size:11.5px;color:var(--mut);text-align:center;direction:rtl;padding-top:6px}
/* exercise */
.mc{display:grid;gap:10px}
.mc.n2{grid-template-columns:1fr 1fr}.mc.n3{grid-template-columns:1fr 1fr 1fr}
.mc button{min-height:72px;border-radius:18px;background:var(--panel);border:1.5px solid var(--line);font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:8px;transition:.15s;line-height:1.25}
.mc button .fr{font-size:1.2em}
.mc button.ok{border-color:var(--lime);background:#b6ff3b22;box-shadow:0 0 20px #b6ff3b55}
.mc button.no{border-color:var(--red);background:#ff4d6d22;animation:shk .35s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.disp{height:60px;border-radius:16px;background:#000;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-size:32px;font-weight:900;direction:ltr;font-variant-numeric:tabular-nums}
.disp .cur{width:3px;height:32px;background:var(--cyan);animation:blink 1s infinite}
.disp .u{font-size:16px;color:var(--mut);font-weight:700;direction:rtl}
.disp.no{border-color:var(--red);animation:shk .35s}.disp.ok{border-color:var(--lime)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.kp button{height:54px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:24px;font-weight:800}
.kp button:active{background:var(--panel2)}
.res{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.res .bigm{font-size:64px;line-height:1}
.res .rt{font-size:24px;font-weight:900}
.ansline{border-radius:14px;background:#b6ff3b14;border:1px solid #b6ff3b55;padding:10px 12px;text-align:center;font-weight:800;font-size:17px}
#fx{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden}
.conf{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-height:700px){.logo{font-size:46px}.qbox .m{font-size:26px}.kp button{height:46px}.disp{height:52px}.mc button{min-height:60px}.step .tx .m{font-size:19px}.bigsc{font-size:68px}.skin{min-height:108px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
 <canvas id="cv"></canvas>
 <div id="hud"><span class="chip" id="hearts">❤️❤️❤️</span><span class="sp"></span><span class="chip" id="coinc">🪙 0</span><button class="ibtn" id="pauseB" aria-label="השהיה">⏸</button></div>
 <div id="score">0</div>
 <div id="tip">טאפ כדי להפיל את הבלוק 👆</div>
 <section class="layer" id="home"></section>
 <section class="layer dim" id="over"></section>
 <section class="layer dim" id="pause"></section>
 <section class="layer dim" id="shop"></section>
 <section class="layer dim" id="rest"></section>
 <section class="layer" id="bb"></section>
 <div id="fx"></div>
</div>
<script>
/* =========================================================
   CONTENT — pluggable. Each topic: {id,name,icon,gen(level 0..2)}
   gen returns {q, qm, kind:'mc'|'num', choices:[{h,ok}] | answer:number, unit?, steps:[{t,m?,v?,fin?}], ans}

function colz(rows,res){const w=Math.max(...rows.map(r=>r[1].length),res.length);return `<div class="colz">${rows.map(([op,s])=>`<div>${op}&nbsp;${s.padStart(w,' ').replace(/ /g,'&nbsp;')}</div>`).join('')}<hr><div>&nbsp;&nbsp;${res.padStart(w,' ').replace(/ /g,'&nbsp;')}</div></div>`}

/* ---------- FRACTIONS — follows מדריך להורה: "חיבור שברים עם אותו מכנה" + שברים שווים ----------
   Every example explains WHY (same-size pieces), shows that expanding/simplifying keeps the amount,
   shows both legit routes (expand / simplify) when both exist, picks one and says why, simplifies, checks. */
const simp=(n,d)=>{const g=gcd(n,d);return[n/g,d/g]};
const FS=(n,d)=>{const[a,b]=simp(n,d);return b===1?String(a):F(a,b)};          // simplified display
const bar=(n,d,c,lab,k)=>{ // n of d pieces coloured; k>1 = each piece gets cut into k (animated)
  const cells=Array.from({length:d},(_,i)=>`<i class="${i<n?'on '+(c||''):''}">${k>1?Array.from({length:k},()=>'<b></b>').join(''):''}</i>`).join('');
  return `<div class="brow"><span class="bl">${lab||''}</span><div class="fbar${k>1?' split':''}">${cells}</div></div>`};
const nline=(D,marks)=>{let t='';for(let i=0;i<=D;i++)t+=`<i style="left:${i/D*100}%"></i>`;
  if(D%2)t+=`<i class="h" style="left:50%"></i>`;
  const mk=marks.map(m=>`<span class="mk ${m.c||''}" style="left:${Math.min(1,m.n/m.d)*100}%">${m.lab}<u></u></span>`).join('');
  return `<div class="nl"><div class="ax">${t}</div>${mk}<span class="z" style="left:0">0</span><span class="z" style="left:50%">${F(1,2)}</span><span class="z" style="left:100%">1</span></div>`};
const half=(n,d)=>2*n<d?'פחות מחצי':2*n>d?'יותר מחצי':'בדיוק חצי';
// pieces language
const PN={2:'חצאים',3:'שלישים',4:'רבעים',5:'חמישיות',6:'שישיות',8:'שמיניות',9:'תשיעיות',10:'עשיריות',12:'שנים־עשר חלקים'};
const pn=d=>PN[d]||`${d} חלקים`;
PN[7]='שביעיות';PN[12]='חלקי־12';
// Greg-Tang units language: denominator = unit name, numerator = how many units
const SG={2:['חצי',0],3:['שליש',0],4:['רבע',0],5:['חמישית',1],6:['שישית',1],7:['שביעית',1],8:['שמינית',1],9:['תשיעית',1],10:['עשירית',1],12:['חלק־12',0]};
const U=(n,d)=>{const[sg,f]=SG[d]||[`חלק מ־${d}`,0];if(n===1)return sg+(f?' אחת':' אחד');if(n===2)return(f?'שתי ':'שני ')+pn(d);return n+' '+pn(d)};
/* plan for two fractions n1/d1, n2/d2 (d1<=d2 in "multiple" case) */
function fracPlan(n1,d1,n2,d2){
  const st=[];const D=lcm(d1,d2);
  st.push({t:`המכנה (למטה) הוא שם היחידה – לכמה חלקים חתכנו. המונה (למעלה) – כמה יחידות לקחנו. ${F(n1,d1)} = ${E(U(n1,d1))}, ${F(n2,d2)} = ${E(U(n2,d2),'c2')}.`,m:M(F(n1,d1)+' &nbsp;,&nbsp; '+F(n2,d2)),
    v:bar(n1,d1,'',M(F(n1,d1)))+bar(n2,d2,'c2',M(F(n2,d2)))});
  if(d1===d2)return{st,D,a:n1,b:n2,same:true};
  st.push({t:`למה אי אפשר פשוט לספור? כי היחידות בגודל שונה: ברצועות רואים ש${U(1,d1)} ${d1<d2?'גדול':'קטן'}${SG[d1]&&SG[d1][1]?'ה':''} מ${U(1,d2)}. סופרים יחד רק יחידות עם אותו שם (אותו מכנה) – כמו ש־2 תפוחים ועוד 4 אבטיחים זה לא 6 תפוחים.`,
    m:M(`${E(F(1,d1))} ${d1<d2?'&gt;':'&lt;'} ${E(F(1,d2),'c2')}`),v:bar(1,d1,'',M(F(1,d1)))+bar(1,d2,'c2',M(F(1,d2)))});
  const big=Math.max(d1,d2),small=Math.min(d1,d2),mult=big%small===0;
  const [ns,ds,nb,db]=d1<=d2?[n1,d1,n2,d2]:[n2,d2,n1,d1];   // s = fraction with smaller denominator
  if(mult){const k=big/small;
    st.push({t:`מחליפים יחידה בלי לשנות את הכמות: מקפלים כל ${SG[ds]?SG[ds][0]:'חלק'} ל־${k} (כמו קיפול נייר) – ${U(1,ds)} = ${U(k,db)}. החתיכות קטנות פי ${k}, ויש פי ${k} מהן, לכן ${U(ns,ds)} = ${E(U(ns*k,db))}. בתרגיל: כופלים מונה ומכנה באותו מספר:`,
      m:M(`${F(ns,ds)} = ${F(ns+' × '+k,ds+' × '+k)} = ${F(E(ns*k),E(db))}`),v:bar(ns,ds,'',M(F(ns,ds)),k)+bar(ns*k,db,'',M(F(ns*k,db)))});

      st.push({t:`איך בוחרים? לחתוך ${pn(ds)} ל${pn(db)} אפשר תמיד (דרך א׳). לאחד ${pn(db)} ל${pn(ds)} אפשר רק כשמספר ה${pn(db)} מתחלק ב־${sk} – כאן ${nb} מתחלק ב־${sk}, אז גם דרך ב׳ נכונה. בחרנו בדרך א׳ כי היא עובדת תמיד; בדרך ב׳ נשתמש לבדיקה.`});
      return{st,D:db,a:A,b:B,alt:{a:d1<=d2?n1:n1/sk,b:d1<=d2?n2/sk:n2,D:ds}}}
    st.push({t:`איך בוחרים? לחתוך ${pn(ds)} ל${pn(db)} אפשר תמיד – אז מחליפים ל${pn(db)}. (לאחד ${U(nb,db)} ל${pn(ds)} אי אפשר, כי ${nb} לא מתחלק ב־${sk} – לכן כאן רק הרחבה.)`});
    return{st,D:db,a:A,b:B}}
  const k1=D/d1,k2=D/d2;
  st.push({t:`אי אפשר לחתוך ${pn(d1)} ל${pn(d2)} ולא להפך, אז מחפשים יחידה שלישית ששתיהן נחתכות אליה: המספר הכי קטן ששני המכנים נכנסים בו – ${D}, כלומר ${pn(D)}.`,m:M(`${d1} × ${k1} = ${D} &nbsp; , &nbsp; ${d2} × ${k2} = ${D}`)});

    m:M(`${F(n1,d1)} = ${F(E(n1*k1),D)} &nbsp; ${F(n2,d2)} = ${F(E(n2*k2,'c2'),D)}`),v:bar(n1,d1,'',M(F(n1,d1)),k1)+bar(n2,d2,'c2',M(F(n2,d2)),k2)});

function fracPair(L){let d1,d2,n1,n2;

   ========================================================= */
const LAYERS=['home','over','pause','shop','rest','bb'];
function show(id){for(const l of LAYERS)$('#'+l).classList.toggle('on',l===id||(id==='rest'&&l==='over'));const play=id===null;
 $('#hud').classList.toggle('on',play||id==='pause');$('#score').style.display=(play||id==='pause'||id==='over'||id==='rest')?'block':'none';
 if(id==='over'||id==='rest')$('#score').style.display='none'}
const heartsTxt=()=>'❤️'.repeat(Math.max(0,G.hearts))+'🖤'.repeat(Math.max(0,3-G.hearts));
function updHud(){if(!G)return;$('#hearts').textContent=heartsTxt();$('#coinc').textContent='🪙 '+G.coins}
const sndLabel=()=>S.snd?'🔊':'🔇';
function home(){mode='home';newRun();show('home');save();
 $('#home').innerHTML=`<div class="row"><span class="en">NEON STACK</span><span class="sp"></span><span class="chip">🪙 ${S.coins}</span><button class="ibtn" id="sndH" aria-label="סאונד">${sndLabel()}</button></div>
 <div class="sp" style="flex:.6"></div><div class="logo">מגדל<br>ניאון</div><p class="tagline" style="margin-top:10px">בונים הכי גבוה שאפשר. טאפ אחד, אצבע אחת. מפספסים? הפסקת מוח קצרה ← חוזרים למשחק.</p>
 <div class="sp"></div><div class="stats3"><div class="st"><b>${S.best}</b><small>שיא</small></div><div class="st"><b>${S.coins}</b><small>מטבעות</small></div><div class="st"><b>${S.day.solved}</b><small>תרגילים היום</small></div></div>
 <div class="howto" style="margin-top:10px">👆 טאפ = הפלת בלוק · 🎯 פגיעה מושלמת = קומבו ובלוק גדל · ❤️ 3 חיים</div>
 <div class="col" style="margin-top:12px"><button class="go" id="playB">▶ שחקו</button><button class="btn" id="shopB">🎨 סקינים</button></div>
 <p class="about" style="margin:10px 0 0">חינם · בלי פרסומות אמיתיות · בלי איסוף מידע · פרויקט התנדבותי של הורים</p>`;
 $('#playB').onclick=start;$('#shopB').onclick=shop;$('#sndH').onclick=e=>{S.snd=!S.snd;save();e.currentTarget.textContent=sndLabel();sfx.click()}}
function start(){sfx.click();newRun();mode='play';G.cur.v=Math.min(150,430)*(W/390);show(null);$('#score').textContent='0';$('#tip').style.display='block';updHud()}
function gameOver(){mode='over';G.cur=null;S.coins+=G.coins-G.banked;G.banked=G.coins;const nb=G.score>S.best;if(nb)S.best=G.score;S.day.best=Math.max(S.day.best,G.score);save();renderOver(nb);show('over');
 if(S.day.ms>=S.day.rest){S.day.rest=S.day.ms+REST_MS;save();renderRest();show('rest')}}
function renderOver(nb){const canRev=G.revives<2,canX2=!G.doubled&&G.coins>0;
 $('#over').innerHTML=`<div class="sp"></div><p class="ttl">${G.revives?'נגמרו החיים… שוב 😅':'נגמרו החיים 💥'}</p>
 <div class="bigsc" style="margin:8px 0 2px">${G.score}</div>${nb?'<div class="nb">★ NEW BEST ★</div>':`<p class="mut">שיא: ${S.best}</p>`}
 <p class="mut" style="margin-top:6px">🪙 +${G.coins} מטבעות בסיבוב · ${G.perfects} פגיעות מושלמות</p><div class="sp"></div>
 <div class="col">${canRev?`<button class="btn bb" id="revB">❤️ החייאה — הפסקת מוח<small>דוגמה קצרה + תרגיל אחד (${2-G.revives} נשארו)</small></button>`:''}
 ${canX2?`<button class="btn bb" id="x2B">🪙 ×2 מטבעות — הפסקת מוח<small>מכפילים את ה־${G.coins} של הסיבוב</small></button>`:''}
 <button class="go" id="againB">↻ סיבוב חדש</button><button class="btn" id="homeB">🏠 בית</button></div>`;
 if(canRev)$('#revB').onclick=()=>brainBreak(null,'revive');if(canX2)$('#x2B').onclick=()=>brainBreak(null,'double');$('#againB').onclick=start;$('#homeB').onclick=home}
function renderRest(){const min=Math.round(S.day.ms/60000);
 $('#rest').innerHTML=`<div class="sp"></div><div style="font-size:64px;text-align:center">🌙</div><p class="ttl">שיחקת אותה טוב היום</p>
 <p class="mut" style="font-size:15.5px;margin-top:6px">כבר ${min} דקות של משחק. המוח עבד – זה רגע טוב לעצור.<br>ואם בא לך עוד סיבוב, גם זה בסדר.</p>
 <div class="stats3" style="margin-top:16px"><div class="st"><b>${S.day.solved}</b><small>תרגילים היום</small></div><div class="st"><b>${S.day.best}</b><small>שיא היום</small></div><div class="st"><b>${S.best}</b><small>שיא כללי</small></div></div>
 <div class="sp"></div><div class="col"><button class="go" id="doneB">סיימתי להיום 👋</button><button class="btn" id="moreB">עוד סיבוב</button></div>`;
 $('#doneB').onclick=home;$('#moreB').onclick=()=>show('over')}
function shop(){sfx.click();show('shop');
 const pv=s=>`<div class="pv">${[0,1,2,3].map(i=>`<i style="width:${70-i*10}px;background:${s.col(3-i)};box-shadow:0 0 8px ${s.col(3-i)}"></i>`).join('')}</div>`;
 $('#shop').innerHTML=`<div class="row"><button class="ibtn" id="shopX" aria-label="חזרה">→</button><p class="h2" style="flex:1">סקינים</p><span class="chip">🪙 ${S.coins}</span></div>
 <p class="mut" style="text-align:right;margin:8px 0 10px">אוספים מטבעות במשחק ופותחים סקינים. אין קניות בכסף אמיתי.</p>
 <div class="skins">${SKINS.map(s=>{const own=S.skins.includes(s.id);return `<button class="skin ${S.skin===s.id?'sel':''} ${own?'':'lock'} ${!own&&S.coins<s.price?'cant':''}" data-id="${s.id}">${pv(s)}<span style="direction:ltr">${s.name}</span><span class="pr">${S.skin===s.id?'✔ בשימוש':own?'בחירה':'🪙 '+s.price}</span></button>`}).join('')}</div>`;
 $('#shopX').onclick=home;
 document.querySelectorAll('.skin').forEach(b=>b.onclick=()=>{const s=SKINS.find(k=>k.id===b.dataset.id);
  if(!S.skins.includes(s.id)){if(S.coins<s.price){b.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:250});sfx.no();return}S.coins-=s.price;S.skins.push(s.id);sfx.win();confetti()}
  S.skin=s.id;save();shop()})}
function pause(){if(mode!=='play')return;mode='paused';show('pause');
 $('#pause').innerHTML=`<div class="sp"></div><p class="ttl">⏸ הפסקה</p><p class="mut" style="margin-top:6px">גובה: ${G.score} · ${heartsTxt()}</p><div class="sp"></div>
 <div class="col"><button class="go" id="resB">▶ ממשיכים</button><button class="btn" id="sndP">${sndLabel()} סאונד</button><button class="btn" id="qB">🏠 יציאה לבית</button></div>`;
 $('#resB').onclick=()=>{mode='play';show(null);last=performance.now()};$('#qB').onclick=()=>{S.coins+=G.coins-G.banked;G.banked=G.coins;if(G.score>S.best)S.best=G.score;home()};
 $('#sndP').onclick=e=>{S.snd=!S.snd;save();e.currentTarget.textContent=sndLabel()+' סאונד'}}
$('#pauseB').onclick=pause;
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();save()}});
function confetti(n=40){const fx=$('#fx');for(let i=0;i<n;i++){const e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'%';e.style.background=['#b6ff3b','#22e4ff','#ff2bd6','#ffd23f','#8a5cff'][i%5];e.style.animationDuration=(1+Math.random()*1.2)+'s';e.style.animationDelay=Math.random()*.3+'s';fx.appendChild(e);setTimeout(()=>e.remove(),2700)}}

/* =========================================================
   BRAIN BREAK — the "ad": worked example → one exercise
   ========================================================= */
let BBS={};
function nextTopic(){if(!S.q||!S.q.length||S.q.some(i=>i>=TOPICS.length))S.q=shuffle(TOPICS.map((_,i)=>i));const t=S.q.shift();save();return t}
const lvOf=id=>Math.max(0,Math.min(2,Math.floor(S.lv[id]||0)));
function brainBreak(ti,purpose){sfx.click();if(ti==null)ti=nextTopic();const T=TOPICS[ti];
 BBS={ti,T,purpose,phase:'ad',attempt:1,ex:T.gen(lvOf(T.id)),t0:performance.now(),timers:[]};mode='bb';show('bb');renderAd()}
function clearT(){(BBS.timers||[]).forEach(clearTimeout);(BBS.timers||[]).forEach(clearInterval);BBS.timers=[]}
const rewardTxt=()=>BBS.purpose==='revive'?'❤️ חיים נוספים + חוזרים לאותו מגדל':'🪙 מכפילים את מטבעות הסיבוב';
function renderAd(){const ex=BBS.ex,T=BBS.T;
 $('#bb').innerHTML=`<div class="adbar"><span class="adtag">🧠 BRAIN AD</span><span class="cd" id="cd"></span><span class="sp"></span><button class="skipad" id="skip">דלגו (בלי פרס) ✕</button></div>
 <div class="adprog"><i id="prog"></i></div>
 <div class="bbbody" id="bbody"><div class="row"><span class="tchip">${T.icon} ${T.name}</span><span class="sp"></span><span class="tchip" style="color:var(--yel);border-color:#ffd23f55;background:#ffd23f14">פרס: ${BBS.purpose==='revive'?'❤️':'🪙×2'}</span></div>
 <p class="h2">ככה פותרים 👀</p><div class="qbox">${ex.q}${ex.qm?`<div class="m" style="margin-top:4px">${ex.qm}</div>`:''}</div><div class="steps" id="steps"></div></div>
 <button class="go turn" id="turnB" style="margin-top:10px">עכשיו תורכם ▶</button><div class="spon">Sponsored by: המוח שלך 😉</div>`;
 const stepEl=$('#steps'),n=ex.steps.length,per=STEP_MS;AD_MS=per*(n+.6);let k=0;
 const addStep=()=>{if(k>=n||BBS.phase!=='ad')return;stepEl.insertAdjacentHTML('beforeend',stepHTML(ex.steps[k],k));k++;sfx.drop(k*2);const b=$('#bbody');b.scrollTo({top:b.scrollHeight,behavior:'smooth'})};
 BBS.timers.push(setTimeout(addStep,350));for(let j=1;j<n;j++)BBS.timers.push(setTimeout(addStep,350+per*j));
 BBS.timers.push(setTimeout(()=>{$('#skip').classList.add('on')},SKIP_MS));
 BBS.timers.push(setInterval(()=>{const el=performance.now()-BBS.t0,left=Math.max(0,Math.ceil((AD_MS-el)/1000));const cd=$('#cd'),pr=$('#prog');if(!cd)return;
  cd.textContent=left?('0:'+String(left).padStart(2,'0')):'✔';pr.style.width=Math.min(100,el/AD_MS*100)+'%';if(el>=AD_MS){$('#turnB').classList.add('on');while(k<n)addStep()}},200));
 $('#skip').onclick=()=>{clearT();sfx.click();endBB(false)};$('#turnB').onclick=()=>{clearT();renderEx()}}
const stepHTML=(s,k,cmp)=>`<div class="step ${s.fin?'fin':''}"><span class="nm">${s.fin?'✔':k+1}</span><div class="tx">${s.t}${s.m?`<span class="m">${s.m}</span>`:''}${s.v?`<div class="vz">${s.v}</div>`:''}</div></div>`;
function renderEx(){BBS.phase='ex';const T=BBS.T;if(BBS.attempt>1||!BBS.ex2)BBS.ex2=T.gen(lvOf(T.id));const ex=BBS.ex2;BBS.kind=ex.kind;BBS.val='';sfx.click();
 const body=ex.kind==='mc'?`<div class="mc n${ex.choices.length===3?3:2}">${ex.choices.map((c,i)=>`<button data-i="${i}">${c.h}</button>`).join('')}</div>`
 :`<div class="disp" id="disp"><span id="dv"></span><span class="cur"></span>${ex.unit?`<span class="u">${ex.unit}</span>`:''}</div>
  <div class="kp">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div><button class="go" id="chk">✔ בדיקה</button>`;
 $('#bb').innerHTML=`<div class="adbar"><span class="adtag">🧠 ${BBS.attempt>1?'עוד ניסיון':'תורכם!'}</span><span class="sp"></span><button class="skipad on" id="skip">ויתור (בלי פרס) ✕</button></div>
 <div class="adprog"><i style="width:100%"></i></div>
 <div class="bbbody"><div class="row"><span class="tchip">${T.icon} ${T.name}</span><span class="sp"></span><span class="tchip" style="color:var(--yel);border-color:#ffd23f55;background:#ffd23f14">פרס: ${BBS.purpose==='revive'?'❤️':'🪙×2'}</span></div>
 <p class="h2">תרגיל אחד, וחוזרים לשחק</p><div class="qbox" id="qbox">${ex.q}${ex.qm?`<div class="m" style="margin-top:4px">${ex.qm}</div>`:''}</div><div class="sp" style="flex:.3"></div>${body}</div>`;
 $('#skip').onclick=()=>{sfx.click();endBB(false)};
 if(ex.kind==='mc')document.querySelectorAll('.mc button').forEach(b=>b.onclick=()=>{if(BBS.phase!=='ex')return;const c=ex.choices[+b.dataset.i];b.classList.add(c.ok?'ok':'no');
   if(!c.ok)document.querySelectorAll('.mc button').forEach((bb,i)=>{if(ex.choices[i].ok)bb.classList.add('ok')});answer(c.ok)});
 else{document.querySelectorAll('.kp button').forEach(b=>b.onclick=()=>kpKey(b.dataset.k));$('#chk').onclick=()=>kpKey('Enter');updDisp()}}
function updDisp(){const d=$('#dv');if(d)d.textContent=BBS.val}
function kpKey(k){if(BBS.phase!=='ex'||BBS.kind!=='num')return;
 if(k==='⌫'||k==='Backspace')BBS.val=BBS.val.slice(0,-1);else if(/^[0-9]$/.test(k)){if(BBS.val.length<7)BBS.val+=k}else if(k==='.'||k===','){if(!BBS.val.includes('.'))BBS.val+=(BBS.val?'':'0')+'.'}
 else if(k==='Enter'){if(!BBS.val||BBS.val==='0.')return $('#disp').animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:200});
  const ok=Math.abs(parseFloat(BBS.val)-BBS.ex2.answer)<1e-9;$('#disp').classList.add(ok?'ok':'no');answer(ok);return}else return;sfx.click();updDisp()}
function answer(ok){BBS.phase='res';const id=BBS.T.id;
 if(ok){if(BBS.attempt===1)S.lv[id]=Math.min(2.99,(S.lv[id]||0)+.34);S.solved++;S.day.solved++;save();sfx.win();buzz([20,40,20]);confetti();
  setTimeout(()=>renderRes(true),650)}
 else{S.lv[id]=Math.max(0,(S.lv[id]||0)-.5);save();sfx.no();buzz(80);setTimeout(()=>renderRes(false),750)}}
function renderRes(ok){const ex=BBS.ex2,last=BBS.attempt>=2;
 if(ok){$('#bb').innerHTML=`<div class="sp"></div><div class="res"><div class="bigm">🎉</div><div class="rt">נכון! ${BBS.attempt>1?'בניסיון השני – אלופים':'מכה ראשונה'}</div>
  <div class="ansline">${ex.ans}</div><p class="mut">${rewardTxt()}</p></div><div class="sp"></div><button class="go" id="contB">${BBS.purpose==='revive'?'❤️ חוזרים למגדל ▶':'🪙 לקחת ×2 ▶'}</button>`;
  $('#contB').onclick=()=>endBB(true);return}
 BBS.phase='res';$('#bb').innerHTML=`<div class="adbar"><span class="adtag" style="background:var(--red);color:#fff">${last?'טעות היא רמז 💪':'כמעט!'}</span><span class="sp"></span></div><div class="adprog"><i style="width:100%;background:var(--red)"></i></div>
 <div class="bbbody"><p class="h2">${last?'בוא נעבור יחד על הפתרון – ובסוף מקבלים את הפרס':'בוא נבדוק יחד:'}</p><div class="qbox" style="padding:10px">${ex.q}${ex.qm?`<div class="m" style="font-size:24px">${ex.qm}</div>`:''}</div>
 <div class="ansline">התשובה: ${ex.ans}</div><div class="steps compact" id="solSteps">${last?'':ex.steps.filter(s=>!s.fin).map((s,k)=>stepHTML({t:s.t,m:s.m},k)).join('')}</div></div>
 <div class="col" style="margin-top:10px">${last?`<button class="go turn" id="backB">עברתי על הפתרון – ממשיכים ▶</button>`:`<button class="go" id="againEx">תרגיל דומה ▶</button><button class="btn" id="giveB" style="min-height:46px">ויתור (בלי פרס)</button>`}</div>`;
 if(last){const ss=ex.steps.filter(s=>!s.fin),el=$('#solSteps');let k=0;const add=()=>{if(BBS.phase!=='res')return;el.insertAdjacentHTML('beforeend',stepHTML(ss[k],k));k++;const b=el.closest('.bbbody');b.scrollTo({top:b.scrollHeight,behavior:'smooth'});
   if(k<ss.length)BBS.timers.push(setTimeout(add,FAST?150:2200));else $('#backB').classList.add('on')};add();$('#backB').onclick=()=>endBB(true)}else{$('#againEx').onclick=()=>{BBS.attempt=2;renderEx()};$('#giveB').onclick=()=>endBB(false)}}
function endBB(win){clearT();BBS.phase='done';
 if(win&&BBS.purpose==='revive'){G.revives++;G.hearts=1;G.dead=false;const top=topB(),w=Math.min(BASEW,Math.max(top.w,BASEW*.7));G.blocks.push({x:(W-w)/2,w,i:G.blocks.length});
  rings.push({x:W/2,y:(G.blocks.length-.5)*BH,w,t:0});spawn();mode='play';show(null);$('#score').textContent=G.score;updHud();$('#tip').style.display='none';
  texts.push({s:'REVIVED ❤️',x:W/2,y:(G.blocks.length+1)*BH,t:0,c:'#b6ff3b'});last=performance.now();return}
 if(win&&BBS.purpose==='double'){S.coins+=G.coins;G.coins*=2;G.banked=G.coins;G.doubled=true;save()}
 mode='over';renderOver(false);show('over')}

/* test hooks (harmless in production) */
window.BB={brainBreak,get S(){return S},get G(){return G},get mode(){return mode},get bbs(){return BBS},TOPICS,drop,start,home,
 forceOver(){if(mode!=='play')start();G.hearts=0;G.dead=true;gameOver()},setPlayMs(ms){S.day.ms=ms;save()},
 perfectDrop(){if(G.cur){G.cur.x=topB().x;drop()}},missDrop(){if(G.cur){G.cur.x=topB().x>W/2?-G.cur.w:W;drop()}}};
home();requestAnimationFrame(frame);
</script>
